# LACD adopter CI template — managed file (merge: replace).
# Installed by `lacd init` at .github/workflows/lacd-verify.yml and refreshed
# by `lacd upgrade`. Do not edit manually; project-specific checks belong in
# project-owned workflow files.
#
# Design (v1.0.1, low-privilege):
# - Runs `lacd verify --local --strict`: LOCAL dimensions only (config valid,
#   no drift, nothing blocking). Makes NO network requests and needs NO
#   GitHub token, so this job stays green even when the runner cannot read
#   branch protection / rulesets (R07). Remote enforcement is a Human
#   responsibility (`lacd verify --remote`, run locally with a credential);
#   CI never claims ENFORCED.
# - `verify --local` reports remote_enforcement as unverified/LOCAL_ONLY:
#   "not checked" is never confused with "passed".
#
# Action pins (full commit SHAs, verified 2026-10-12 via api.github.com):
#   actions/checkout v4      -> 11d5960a326750d5838078e36cf38b85af677262
#   actions/setup-python v5  -> a26af69be951a213d495a4c3e4e4022e16d87065
# The CLI install step pins the locked LACD release tag. Tag stability is
# controlled by the LACD Release process (annotated tag; moves require
# explicit Human approval and re-verification). Residual risk: tags can be
# moved by account compromise or force-push; see ADR-0012.
# deleted); `lacd upgrade` bumps it together with template_version.

name: lacd-verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  lacd-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install LACD CLI (locked release tag)
        run: pip install "git+https://github.com/SkyCjq/LACD.git@v1.0.2"

      - name: Show LACD version
        run: lacd --version

      - name: Verify adoption state (local dimensions, strict)
        run: lacd verify --local --strict
