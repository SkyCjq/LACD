# LACD adopter CI template — managed file (merge: replace).
# Installed by `lacd init` at .github/workflows/lacd-verify.yml and refreshed
# by `lacd upgrade`. Do not edit manually; project-specific checks belong in
# project-owned workflow files.
#
# Action pins (full commit SHAs, verified 2026-10-12 via api.github.com):
#   actions/checkout v4      -> 11d5960a326750d5838078e36cf38b85af677262
#   actions/setup-python v5  -> a26af69be951a213d495a4c3e4e4022e16d87065
# The CLI install step pins the locked LACD release tag; `lacd upgrade` bumps
# it together with template_version.

name: lacd-verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  lacd-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install LACD CLI (locked version)
        run: pip install "git+https://github.com/SkyCjq/LACD.git@v1.0.0"

      - name: Verify adoption state (strict)
        run: lacd verify --strict
