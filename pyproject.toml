[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lacd"
version = "1.0.0"
description = "Lightweight Agentic Collaborative Development - governance and collaboration framework for agentic software development"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyyaml",
    "jsonschema",
]

[project.scripts]
lacd = "lacd.cli.main:main"

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lacd = ["schemas/*.json"]
"lacd.schemas" = ["*.json"]
